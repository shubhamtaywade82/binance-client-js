name: Release Drafter

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  update-release-draft:
    name: Update Release Draft
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version from tag
        id: get_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Extracted version: $TAG_NAME"
      
      - name: Create Release Notes
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Release ${{ steps.get_version.outputs.tag_name }}
          body: |
            ## 🎉 Release ${{ steps.get_version.outputs.tag_name }}
            
            ### 📦 Installation
            
            ```bash
            npm install binance-usdm-futures@latest
            ```
            
            ### ✨ What's New
            
            - See commit history for detailed changes
            
            ### 📚 Documentation
            
            - [README](https://github.com/${{ github.repository }}/blob/main/README.md)
            - [AI Agent Skills Guide](https://github.com/${{ github.repository }}/blob/main/docs/AI_AGENT_SKILLS_INTEGRATION.md)
            
            ### 🔗 Links
            
            - [NPM Package](https://www.npmjs.com/package/binance-usdm-futures)
            - [Issues](https://github.com/${{ github.repository }}/issues)
            
            ---
            *This release was automatically generated by GitHub Actions*
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
