name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check syntax
        run: npm run check:syntax
      
      - name: Run unit tests
        run: npm run test:unit
      
      - name: Verify exports
        run: npm run verify:exports
      
      - name: Run full verification
        run: npm run verify

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Run npm audit (fix available)
        run: npm audit fix --dry-run

  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Create package tarball
        run: npm pack
      
      - name: Verify package contents
        run: |
          tar -tzf binance-client-*.tgz | head -20
          echo "Package validation successful"

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-audit, build-validation]
    if: github.event_name == 'release' && github.event.action == 'published'
    
    environment:
      name: npm
      url: https://www.npmjs.com/package/binance-client
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Configure npm for publishing
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
      
      - name: Verify version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      
      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Create GitHub Release Notes
        if: success()
        run: |
          echo "✅ Successfully published binance-client@${{ env.VERSION }} to NPM"
          echo "📦 Package available at: https://www.npmjs.com/package/binance-client"

  auto-tag:
    name: Auto Tag Release
    runs-on: ubuntu-latest
    needs: [publish-npm]
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create Git Tag
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git tag -a "v${{ steps.get_version.outputs.version }}" -m "Release v${{ steps.get_version.outputs.version }}"
          git push origin "v${{ steps.get_version.outputs.version }}" || echo "Tag already exists"
